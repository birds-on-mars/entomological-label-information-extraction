  #       pip install pytest
  #   # TODO
  #   # - name: Run tests
  #   #   run: |
  #   #     pytest unit_tests/

  build-docker-image:
    runs-on: ubuntu-latest
    # needs: unit-tests

    steps:
    - name: Validate Inputs
      run: |
        if [ -z "${{ github.event.inputs.docker-image-tag }}" ]; then
          echo "Error: 'docker-image-tag' input cannot be empty."
          exit 1
        fi
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Build image
      run: |
        docker build -t ${{env.IMAGE_REGISTRY}}/elio:latest -f pipelines/Dockerfile .
        if [ "${{ github.event.inputs.docker-image-tag }}" != "latest" ]; then
          docker tag ${{env.IMAGE_REGISTRY}}/elio:latest ${{env.IMAGE_REGISTRY}}/elio:${{ env.IMAGE_TAG }}
        fi

    # - name: Testing docker run
    #   run: |
    #     docker run --rm ${{env.IMAGE_REGISTRY}}/elio:latest \
    #       python scripts/run_pipeline.py --input-dir /app/data/MLI/input --output-dir /app/data/MLI/output --config-json '{"device": "cpu"}'

    - name: docker login to aws
      run: aws ecr-public get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.IMAGE_REGISTRY }}
    - name: Push image
      run: |
        docker push ${{env.IMAGE_REGISTRY}}/elio:latest
        if [ "${{ github.event.inputs.docker-image-tag }}" != "latest" ]; then
          docker push ${{env.IMAGE_REGISTRY}}/elio:${{env.IMAGE_TAG}}
        fi

