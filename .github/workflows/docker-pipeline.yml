name: Docker Pipeline

on:
  workflow_dispatch:
    inputs:
      docker-image-tag:
        description: "Tag for the docker image."
        required: true
        default: "latest"

# create variables
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: us-east-1
  IMAGE_REGISTRY: public.ecr.aws/birdsonmars
  IMAGE_TAG: ${{ github.event.inputs.docker-image-tag }}

jobs:
