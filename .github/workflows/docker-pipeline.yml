  #     run: |
  #       python -m pip install --upgrade pip
  #       pip install --no-cache-dir \
  #           -r ./pipelines/requirements/segmentation.txt \
  #           -r ./pipelines/requirements/rotation.txt \
  #           -r ./pipelines/requirements/classifier.txt \
  #           -r ./pipelines/requirements/tesseract.txt \
